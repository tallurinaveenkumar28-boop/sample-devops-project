apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: springboot-dev

resources:
  - ../../base

commonLabels:
  environment: dev

patches:
  # Scale down for dev
  - target:
      kind: Deployment
      name: springboot-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 384Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 768Mi
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: dev

  # Dev HPA
  - target:
      kind: HorizontalPodAutoscaler
      name: springboot-app
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3

  # Dev ingress host
  - target:
      kind: Ingress
      name: springboot-app
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: dev.example.com

configMapGenerator:
  - name: springboot-app-config
    behavior: replace
    literals:
      - APP_LOG_LEVEL=DEBUG

images:
  - name: springboot-app
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/springboot-app
    newTag: develop
